<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>BeeAware</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8EA">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json?v=3">
  <style>
    html, body {
      background-color: #FFF8EA;
      margin: 0; padding: 0;
      width: 100%;
      height: 100%;
      /* 100dvh (dynamic viewport height) is a progressive enhancement on
         top of the 100% above: browsers that don't understand `dvh`
         ignore the whole declaration and keep 100%, browsers that do
         use it get an html/body box that tracks the REAL visible height
         as an in-app browser's chrome (WhatsApp's own toolbar, not the
         OS browser's) settles, instead of whatever height was true at
         first layout. This doesn't replace the JS-side fix below —
         Flutter's canvas is sized from window.innerWidth/innerHeight in
         JS, not from this CSS box — but it keeps the background colored
         page underneath the canvas correctly sized so any residual
         mismatch doesn't show as a mismatched-color strip. */
      height: 100dvh;
      /* No flex/centering here on purpose — centering the splash via
         html/body height was what caused it to render slightly
         off-center: any recalculation of the viewport height right
         after first paint (address bar collapsing, in-app browser
         chrome settling, etc.) reflows this box and the flex-centered
         content shifts with it. #loading-logo below centers itself
         instead, pinned with position:fixed, which doesn't depend on
         html/body's own height at all. */
    }

    /* Shown only until Flutter fires its first frame — kept in the same
       background/badge as the native splash so there's no visible swap.
       position:fixed + inset:0 centers this independently of html/body's
       height, so it doesn't shift when the viewport height is
       recalculated right after first paint. */
    #loading-logo {
      position: fixed;
      inset: 0;
      transition: opacity 0.5s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 140px;
      height: auto;
      /* Gentle flight: a bob + slight tilt reads as "hovering" rather than
         a generic bounce, closer to how a bee actually moves than a
         straight up-down loop would. */
      animation: bee-hover 2.2s ease-in-out infinite;
    }

    @keyframes bee-hover {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-10px) rotate(-4deg); }
      50%  { transform: translateY(0) rotate(0deg); }
      75%  { transform: translateY(-6px) rotate(4deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    #loading-message {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #586274;
      text-align: center;
      min-height: 20px;
      animation: message-pulse 2.2s ease-in-out infinite;
    }

    @keyframes message-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-img, #loading-message {
        animation: none;
      }
    }
  </style>
  <body>
    <div id="loading-logo">
      <img src="beeaware_badge.png" class="logo-img" alt="BeeAware">
      <div id="loading-message"></div>
    </div>

    <script>
      // Sem contexto do Flutter ainda (é HTML puro, antes do primeiro
      // frame) — mesma checagem simples de idioma que o resto do app usa
      // para decidir PT vs EN.
      var isPt = (navigator.language || '').toLowerCase().startsWith('pt');
      var messages = isPt
        ? ['Preparando seu mapa de segurança...', 'Verificando fontes de dados...', 'Quase lá...']
        : ['Preparing your safety map...', 'Checking data sources...', 'Almost there...'];

      var messageEl = document.getElementById('loading-message');
      var messageIndex = 0;

      if (messageEl) {
        messageEl.textContent = messages[0];
        setInterval(function() {
          messageIndex = (messageIndex + 1) % messages.length;
          messageEl.textContent = messages[messageIndex];
        }, 2200);
      }

      // Quando o Flutter estiver pronto, ele avisa o navegador
      window.addEventListener('flutter-first-frame', function() {
        var loader = document.getElementById('loading-logo');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      });

      // Flutter Web only relayouts its canvas on the window's own 'resize'
      // event — but when the page is opened from a link (Safari, or an
      // in-app browser like WhatsApp/Instagram), the address bar collapses
      // or settles right after first paint WITHOUT firing that event on
      // some mobile browsers, only a visualViewport resize. Flutter never
      // hears about it, so its canvas stays pinned at the pre-settle size
      // while the browser reveals more real screen underneath — the blank
      // strip at the bottom with the nav bar sitting above it. Bridging
      // visualViewport's resize into a plain window resize makes Flutter
      // pick up the corrected height the same way it would on a manual
      // window resize.
      //
      // This alone turned out NOT to be enough — confirmed via a
      // guaranteed-fresh load (fully force-quit and relaunched, so not a
      // resumed/cached tab) opening a link from WhatsApp into iOS Chrome,
      // where the gap still appeared identically. A round of investigation
      // aimed the SafeArea/MediaQuery viewPadding widget at the Android
      // Custom-Tabs case (see AppBottomNav's `bottom: !kIsWeb`) — that's
      // still believed correct for Android, but it hard-disables Flutter's
      // own reaction to the browser's safe-area inset entirely, so it
      // can't explain a gap that persists on iOS afterwards. That points
      // back to this being a genuine CANVAS problem after all, not a
      // widget-padding one — just not a simple "missed the event" problem
      // either, since the events/polling below already cover that.
      //
      // What's actually going on, per flutter/flutter's own open engine
      // issues, is worse than a missed event:
      //   - #69529: Flutter Web paints everything into a single canvas,
      //     so the browser never sees a native scroll gesture happen
      //     inside the app — which is exactly the signal iOS Safari/Chrome
      //     (both WebKit under the hood, since Chrome on iOS is required
      //     to use Apple's WKWebView engine, not Blink) use to decide when
      //     to settle their own address/toolbar chrome. Its size can still
      //     change shortly after load on its own (WebKit settling its
      //     bottom-toolbar chrome post-navigation), but the app can never
      //     trigger or witness that the way a normal scrolling page would.
      //   - #112231 / #179208: even when Flutter DOES hear about a resize
      //     (event-driven, same as our bridge below), CanvasKit has its
      //     own separate, still-open bug where the LAYOUT recomputes
      //     correctly but the PAINTED pixels don't — it visibly renders
      //     white/blank space at the bottom rather than the corrected
      //     content. In the field, the only thing users found that
      //     reliably cleared it was a manual tap or scroll — i.e. routing
      //     through Flutter's pointer/scroll paint path instead of its
      //     resize path.
      // So dispatching more resize events alone was always going to hit a
      // ceiling: it fixes Flutter's LAYOUT math (necessary) but not
      // necessarily what CanvasKit PAINTS. Below, every resize we detect
      // is followed by a real (not synthetic-event-only) scroll nudge —
      // scroll a pixel away and immediately back — which forces the
      // browser to actually recomposite the canvas against its corrected
      // bounds, the same mechanism a manual scroll fixes it by, without
      // requiring the user to touch anything. We also run this nudge
      // unconditionally a few times shortly after first frame regardless
      // of whether a size change was detected, since the paint glitch can
      // happen from the first frame's own race against WebKit's chrome
      // settling, not only from a later delta.
      function fireResize() {
        window.dispatchEvent(new Event('resize'));
      }

      // Real scroll (not just a resize event) so the browser actually
      // recomposites the canvas layer against its current true bounds —
      // this is the mechanism a manual user scroll was observed to fix
      // the CanvasKit white-space-on-resize bug by. A no-op scrollTo(0,0)
      // was tried and reported NOT to help (matches: nothing moved, so
      // nothing forced a recomposite) — going to 1px and back does.
      function nudgeRepaint() {
        fireResize();
        var y = window.scrollY || window.pageYOffset || 0;
        window.scrollTo(0, y + 1);
        requestAnimationFrame(function() {
          window.scrollTo(0, y);
          fireResize();
        });
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', nudgeRepaint);
      }
      // orientationchange: some in-app browsers only re-settle chrome
      // around a rotation-style event even without an actual rotation.
      // pageshow: fires on bfcache restores, where innerHeight can be
      // stale from before the tab was backgrounded.
      // visibilitychange: WhatsApp can pause/resume the WebView (e.g.
      // switching to it from the chat) in a way that re-settles its
      // toolbar without firing resize/visualViewport at all.
      window.addEventListener('orientationchange', nudgeRepaint);
      window.addEventListener('pageshow', nudgeRepaint);
      document.addEventListener('visibilitychange', nudgeRepaint);

      // Belt-and-suspenders polling: for the first several seconds after
      // load — the window in which an in-app browser's own toolbar
      // typically settles — compare the actual viewport size against
      // the last known one every 250ms and nudge a repaint if it changed,
      // regardless of whether any event fired for it. Cheap (two number
      // comparisons) and self-terminating, so it can't cost anything
      // once the size has settled. Widened from 6s to 10s since WebKit's
      // (Safari/iOS Chrome) chrome-settle timing after an external-link
      // navigation isn't tightly bounded.
      (function pollForSilentResize() {
        var lastWidth = window.innerWidth;
        var lastHeight = window.innerHeight;
        var elapsed = 0;
        var intervalMs = 250;
        var maxMs = 10000;

        var intervalId = setInterval(function() {
          elapsed += intervalMs;
          var w = window.innerWidth;
          var h = window.innerHeight;
          if (w !== lastWidth || h !== lastHeight) {
            lastWidth = w;
            lastHeight = h;
            nudgeRepaint();
          }
          if (elapsed >= maxMs) {
            clearInterval(intervalId);
          }
        }, intervalMs);
      })();

      // Unconditional nudges after first frame: covers the case where
      // window.innerHeight/visualViewport never actually change (so the
      // polling above finds no delta to react to) but the FIRST paint
      // still raced WebKit's own chrome-settling and came out wrong —
      // matching flutter/flutter #112231's description of layout being
      // correct while the painted pixels aren't. Fixed delays rather than
      // a size check, specifically to catch a paint glitch a size-diff
      // check can't see.
      window.addEventListener('flutter-first-frame', function() {
        [150, 800, 2000, 4000].forEach(function(delay) {
          setTimeout(nudgeRepaint, delay);
        });
      });
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
