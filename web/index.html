<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>BeeAware</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8EA">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json?v=3">
  <style>
    html, body {
      background-color: #FFF8EA;
      margin: 0; padding: 0;
      width: 100%;
      height: 100%;
      /* 100dvh (dynamic viewport height) is a progressive enhancement on
         top of the 100% above: browsers that don't understand `dvh`
         ignore the whole declaration and keep 100%, browsers that do
         use it get an html/body box that tracks the REAL visible height
         as an in-app browser's chrome (WhatsApp's own toolbar, not the
         OS browser's) settles, instead of whatever height was true at
         first layout. This doesn't replace the JS-side fix below —
         Flutter's canvas is sized from window.innerWidth/innerHeight in
         JS, not from this CSS box — but it keeps the background colored
         page underneath the canvas correctly sized so any residual
         mismatch doesn't show as a mismatched-color strip. */
      height: 100dvh;
      /* No flex/centering here on purpose — centering the splash via
         html/body height was what caused it to render slightly
         off-center: any recalculation of the viewport height right
         after first paint (address bar collapsing, in-app browser
         chrome settling, etc.) reflows this box and the flex-centered
         content shifts with it. #loading-logo below centers itself
         instead, pinned with position:fixed, which doesn't depend on
         html/body's own height at all. */
    }

    /* Shown only until Flutter fires its first frame — kept in the same
       background/badge as the native splash so there's no visible swap.
       position:fixed + inset:0 centers this independently of html/body's
       height, so it doesn't shift when the viewport height is
       recalculated right after first paint. */
    #loading-logo {
      position: fixed;
      inset: 0;
      transition: opacity 0.5s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 140px;
      height: auto;
      /* Gentle flight: a bob + slight tilt reads as "hovering" rather than
         a generic bounce, closer to how a bee actually moves than a
         straight up-down loop would. */
      animation: bee-hover 2.2s ease-in-out infinite;
    }

    @keyframes bee-hover {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-10px) rotate(-4deg); }
      50%  { transform: translateY(0) rotate(0deg); }
      75%  { transform: translateY(-6px) rotate(4deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    #loading-message {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #586274;
      text-align: center;
      min-height: 20px;
      animation: message-pulse 2.2s ease-in-out infinite;
    }

    @keyframes message-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-img, #loading-message {
        animation: none;
      }
    }
  </style>
  <body>
    <div id="loading-logo">
      <img src="beeaware_badge.png" class="logo-img" alt="BeeAware">
      <div id="loading-message"></div>
    </div>

    <script>
      // Sem contexto do Flutter ainda (é HTML puro, antes do primeiro
      // frame) — mesma checagem simples de idioma que o resto do app usa
      // para decidir PT vs EN.
      var isPt = (navigator.language || '').toLowerCase().startsWith('pt');
      var messages = isPt
        ? ['Preparando seu mapa de segurança...', 'Verificando fontes de dados...', 'Quase lá...']
        : ['Preparing your safety map...', 'Checking data sources...', 'Almost there...'];

      var messageEl = document.getElementById('loading-message');
      var messageIndex = 0;

      if (messageEl) {
        messageEl.textContent = messages[0];
        setInterval(function() {
          messageIndex = (messageIndex + 1) % messages.length;
          messageEl.textContent = messages[messageIndex];
        }, 2200);
      }

      // Quando o Flutter estiver pronto, ele avisa o navegador
      window.addEventListener('flutter-first-frame', function() {
        var loader = document.getElementById('loading-logo');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      });

      // Flutter Web only relayouts its canvas on the window's own 'resize'
      // event — but when the page is opened from a link (Safari, or an
      // in-app browser like WhatsApp/Instagram), the address bar collapses
      // or settles right after first paint WITHOUT firing that event on
      // some mobile browsers, only a visualViewport resize. Flutter never
      // hears about it, so its canvas stays pinned at the pre-settle size
      // while the browser reveals more real screen underneath — the blank
      // strip at the bottom with the nav bar sitting above it. Bridging
      // visualViewport's resize into a plain window resize makes Flutter
      // pick up the corrected height the same way it would on a manual
      // window resize.
      //
      // This alone turned out NOT to be enough for WhatsApp's in-app
      // browser specifically (still reported after this fix shipped).
      // WhatsApp wraps its own native toolbar around a WebView — on
      // Android/iOS that toolbar is known (from broader "100vh in in-app
      // browsers" reports) to settle its size in ways that don't
      // reliably fire ANY viewport-related event at all, unlike
      // Safari/Chrome proper. A single event type is a bet on one
      // browser's behavior, so below we bridge every plausible signal
      // AND add a short polling fallback that catches a silent height
      // change even when nothing fires an event for it — matching the
      // pattern flutter/flutter users found worked (a later interaction
      // forcing a repaint) without requiring the user to tap anything.
      function fireResize() {
        window.dispatchEvent(new Event('resize'));
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fireResize);
      }
      // orientationchange: some in-app browsers only re-settle chrome
      // around a rotation-style event even without an actual rotation.
      // pageshow: fires on bfcache restores, where innerHeight can be
      // stale from before the tab was backgrounded.
      // visibilitychange: WhatsApp can pause/resume the WebView (e.g.
      // switching to it from the chat) in a way that re-settles its
      // toolbar without firing resize/visualViewport at all.
      window.addEventListener('orientationchange', fireResize);
      window.addEventListener('pageshow', fireResize);
      document.addEventListener('visibilitychange', fireResize);

      // Belt-and-suspenders polling: for the first few seconds after
      // load — the window in which an in-app browser's own toolbar
      // typically settles — compare the actual viewport size against
      // the last known one every 250ms and fire a resize if it changed,
      // regardless of whether any event fired for it. Cheap (two number
      // comparisons) and self-terminating, so it can't cost anything
      // once the size has settled.
      (function pollForSilentResize() {
        var lastWidth = window.innerWidth;
        var lastHeight = window.innerHeight;
        var elapsed = 0;
        var intervalMs = 250;
        var maxMs = 6000;

        var intervalId = setInterval(function() {
          elapsed += intervalMs;
          var w = window.innerWidth;
          var h = window.innerHeight;
          if (w !== lastWidth || h !== lastHeight) {
            lastWidth = w;
            lastHeight = h;
            fireResize();
          }
          if (elapsed >= maxMs) {
            clearInterval(intervalId);
          }
        }, intervalMs);
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
