
[functions.onboarding-bonus]
enabled = true
verify_jwt = true
import_map = "./functions/onboarding-bonus/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/onboarding-bonus/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/onboarding-bonus/*.html" ]

[functions.ingest-security-sources]
enabled = true
# verify_jwt stays on: pg_cron authenticates with the project's legacy
# service_role key (stored in Vault, see the use-vault-for-cron-auth
# migration), which is itself a valid signed JWT, so it still passes.
# The function also checks the Authorization header explicitly against
# its own INGEST_FUNCTION_AUTH_TOKEN secret as a second, more specific
# gate — see its source comment for why that's a dedicated secret rather
# than the reserved SUPABASE_SERVICE_ROLE_KEY env var.
verify_jwt = true
entrypoint = "./functions/ingest-security-sources/index.ts"
